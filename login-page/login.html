<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shakespeare in the Park</title>
    <link rel="stylesheet" href="style2.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="container2">
        <form id="welcoming">
            <h1>Login</h1>
            <p style="color: rgb(0, 0, 0);"> Hey! Kjo eshte menaxhimi i studenteve <br>nje website e krijuar per te bere
                punen e lodhshme te notimit te nxenesve
                ne nje obligim argetuese!
                <br>Ju lutem beni log in.<br> Me respekt, Akademia
            </p>
        </form>
    </div>

    <div class="container">
        <h1>Regjistrohu!</h1>
        <form id="registerForm">
            <input id="registerName" type="text" placeholder="Emri">
            <input id="registerEmail" type="email" placeholder="Email">
            <input id="registerPassword" type="password" placeholder="Password-i">
            <button type="submit">Regjistro</button>
        </form>

        <p id="registerMessage"></p>
        <hr>
        <h1>Kyqu!</h1>

        <form id="loginForm" action="index.html">
            <input id="loginEmail" type="email" placeholder="Email">
            <input id="loginPassword" type="password" placeholder="Password-i">
            <button type="submit">Kyqu</button>
        </form>
        <p id="loginMessage"></p>
    </div>
    <script src="script2.js"></script>
</body>

</html>
